<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Sholat Digital Masjid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Sisi Kiri: Jadwal Sholat -->
        <div class="schedule-section" id="schedule-box">
            <!-- Dimuat otomatis via JavaScript -->
        </div>

        <!-- Sisi Kanan: Flyer Background, Jam, Countdown, & Nama Masjid -->
        <div class="content-section">
            <img class="flyer-bg" id="flyer-img" src="" alt="Flyer Informasi">
            <div class="content-overlay"></div>

            <!-- Pojok Kanan Atas: Jam Utama -->
            <div class="top-right-clock">
                <div class="main-clock" id="live-clock">00:00:00</div>
                <div class="main-date" id="live-date">Memuat tanggal...</div>
            </div>

            <!-- Ruang Kosong Tengah -->
            <div class="center-space"></div>

            <!-- Bagian Bawah Kanan: Countdown & Nama Masjid -->
            <div class="bottom-right-panel">
                <div class="countdown-box">
                    <span class="countdown-label" id="countdown-title">Menuju Sholat...</span>
                    <span class="countdown-timer" id="countdown-timer">--:--:--</span>
                </div>
                <div class="mosque-box">
                    <div>
                        <div class="mosque-name" id="display-mosque-name">Masjid Assyaroh</div>
                        <div class="mosque-address" id="display-mosque-address">Jl. Sukadamai IX, Serua Indah, Ciputat</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Paling Bawah: Running Text -->
    <div class="footer-section">
        <div class="running-text" id="display-running-text">Mohon mematikan atau menonaktifkan handphone selama di dalam ruang utama masjid.</div>
    </div>

    <script>
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('masjidConfig')) || {
                mosqueName: "Masjid Assyaroh",
                mosqueAddress: "Jl. Sukadamai IX, Serua Indah, Ciputat",
                runningText: "Mohon mematikan atau menonaktifkan handphone selama di dalam ruang utama masjid.",
                flyers: [
                    "https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?w=1200",
                    "https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200"
                ]
            };

            document.getElementById('display-mosque-name').innerText = config.mosqueName;
            document.getElementById('display-mosque-address').innerText = config.mosqueAddress;
            document.getElementById('display-running-text').innerText = config.runningText;
            
            let flyerIndex = 0;
            const flyerImg = document.getElementById('flyer-img');
            if(config.flyers && config.flyers.length > 0) {
                flyerImg.src = config.flyers[0];
                setInterval(() => {
                    flyerIndex = (flyerIndex + 1) % config.flyers.length;
                    flyerImg.src = config.flyers[flyerIndex];
                }, 7000);
            }
        }

        let globalJadwal = null;

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', options);

            if (globalJadwal) {
                updateCountdown(now, globalJadwal);
            }
        }
        setInterval(updateClock, 1000);

        function updateCountdown(now, jadwal) {
            const currentTime = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            const sholatTimes = [
                { name: 'Shubuh', time: jadwal.subuh },
                { name: 'Dzuhur', time: jadwal.dzuhur },
                { name: 'Ashar', time: jadwal.ashar },
                { name: 'Maghrib', time: jadwal.maghrib },
                { name: 'Isya', time: jadwal.isya }
            ];

            let targetTimeSec = null;
            let targetName = "";

            for (let s of sholatTimes) {
                const parts = s.time.split(':');
                const sec = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60;
                if (sec > currentTime) {
                    targetTimeSec = sec;
                    targetName = s.name;
                    break;
                }
            }

            if (targetTimeSec === null) {
                const parts = sholatTimes[0].time.split(':');
                targetTimeSec = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + 86400;
                targetName = 'Shubuh';
            }

            let diff = targetTimeSec - currentTime;
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;

            const formatDiff = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            document.getElementById('countdown-title').innerText = `Menuju ${targetName}`;
            document.getElementById('countdown-timer').innerText = `-${formatDiff}`;
        }

        async function fetchPrayerTimes() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`https://api.myquran.com/v2/sholat/jadwal/1301/${today}`);
                const data = await response.json();
                globalJadwal = data.data.jadwal;

                // Daftar sholat dengan penegasan teks iqomah yang aman tanpa undefined
                const sholatList = [
                    { name: 'Shubuh', time: globalJadwal.subuh, iqomah: 'Iqomah: 10 mnt' },
                    { name: 'Syuruq', time: globalJadwal.syuruq, iqomah: '-' },
                    { name: 'Dzuhur', time: globalJadwal.dzuhur, iqomah: 'Iqomah: 10 mnt' },
                    { name: 'Ashar', time: globalJadwal.ashar, iqomah: 'Iqomah: 10 mnt' },
                    { name: 'Maghrib', time: globalJadwal.maghrib, iqomah: 'Iqomah: 7 mnt' },
                    { name: 'Isya', time: globalJadwal.isya, iqomah: 'Iqomah: 10 mnt' },
                ];

                let html = '';
                sholatList.forEach(item => {
                    html += `
                        <div class="sholat-card">
                            <div>
                                <div class="sholat-name">${item.name}</div>
                                <div class="iqomah-text">${item.iqomah}</div>
                            </div>
                            <div class="sholat-time">${item.time}</div>
                        </div>
                    `;
                });
                document.getElementById('schedule-box').innerHTML = html;
            } catch (error) {
                document.getElementById('schedule-box').innerHTML = '<p style="padding:10px;">Gagal memuat jadwal</p>';
            }
        }

        loadConfig();
        fetchPrayerTimes();

        setInterval(() => { location.reload(); }, 3600000);
    </script>
</body>
</html>
