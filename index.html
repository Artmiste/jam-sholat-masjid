<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Sholat Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Sisi Kiri: Jadwal Sholat -->
        <div class="schedule-section" id="schedule-box">
            <!-- Data jadwal sholat akan dimuat otomatis oleh JavaScript -->
        </div>

        <!-- Sisi Kanan: Jam & Flyer -->
        <div class="content-section">
            <div class="top-bar">
                <div>
                    <h2 id="active-event-title" style="color: #ffb703;">PENGUMUMAN MASJID</h2>
                </div>
                <div>
                    <div class="main-clock" id="live-clock">00:00:00</div>
                    <div class="main-date" id="live-date">Senin, 13 Jul 2026</div>
                </div>
            </div>

            <!-- Slide Flyer Foto -->
            <div class="flyer-display">
                <img id="flyer-img" src="" alt="Flyer Informasi">
            </div>
        </div>
    </div>

    <!-- Footer & Running Text -->
    <div class="footer-section">
        <div class="mosque-name" id="display-mosque-name">Masjid Al-Ikhlas</div>
        <div class="running-text-container">
            <div class="running-text" id="display-running-text">Selamat datang di masjid kami. Harap matikan ponsel atau satukan shaf demi kelancaran sholat berjamaah.</div>
        </div>
    </div>

    <script>
        // --- 1. AMBIL DATA DARI LOCALSTORAGE / CONFIG JALUR KONTROL ---
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('masjidConfig')) || {
                mosqueName: "Masjid Assyaroh, Serua Indah",
                runningText: "Mohon mematikan atau menonaktifkan handphone selama di dalam ruang utama masjid.",
                flyers: [
                    "https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?w=800",
                    "https://images.unsplash.com/photo-1542838132-92c53300491e?w=800"
                ]
            };

            document.getElementById('display-mosque-name').innerText = config.mosqueName;
            document.getElementById('display-running-text').innerText = config.runningText;
            
            // Slide Flyer Otomatis setiap 5 detik
            let flyerIndex = 0;
            const flyerImg = document.getElementById('flyer-img');
            if(config.flyers && config.flyers.length > 0) {
                flyerImg.src = config.flyers[0];
                setInterval(() => {
                    flyerIndex = (flyerIndex + 1) % config.flyers.length;
                    flyerImg.src = config.flyers[flyerIndex];
                }, 5000);
            }
        }

        // --- 2. JAM UTAMA ---
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. AMBIL JADWAL SHOLAT OTOMATIS (API KEMENAG / MYQURAN) ---
        async function fetchPrayerTimes() {
            try {
                // Contoh endpoint API Jadwal Sholat (Wilayah Tangerang/Jakarta misal ID kota 1301)
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`https://api.myquran.com/v2/sholat/jadwal/1301/${today}`);
                const data = await response.json();
                const jadwal = data.data.jadwal;

                const sholatList = [
                    { name: 'Shubuh', time: jadwal.subuh, iqomah: '+10 menit' },
                    { name: 'Syuruq', time: jadwal.syuruq, iqomah: '-' },
                    { name: 'Dzuhur', time: jadwal.dzuhur, iqomah: '+10 menit' },
                    { name: 'Ashar', time: jadwal.ashar, iqomah: '+10 menit' },
                    { name: 'Maghrib', time: jadwal.maghrib, iqomah: '+7 menit' },
                    { name: 'Isya', time: jadwal.isya, iqomah: '+10 menit' },
                ];

                let html = '';
                sholatList.forEach(item => {
                    html += `
                        <div class="sholat-card">
                            <div>
                                <div class="sholat-name">${item.name}</div>
                                <div class="iqomah-text">Iqomah: ${item.iqomah}</div>
                            </div>
                            <div class="sholat-time">${item.time}</div>
                        </div>
                    `;
                });
                document.getElementById('schedule-box').innerHTML = html;
            } catch (error) {
                document.getElementById('schedule-box').innerHTML = '<p>Gagal memuat jadwal sholat</p>';
            }
        }

        loadConfig();
        fetchPrayerTimes();

        // Refresh otomatis halaman tiap 1 jam untuk sinkronisasi data baru dari admin
        setInterval(() => { location.reload(); }, 3600000);
    </script>
</body>
</html>
